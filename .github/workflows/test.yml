name: Tests

on:
  push:
    branches: [master, development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # mvnw is committed non-executable, as the Dockerfile also works around.
      - run: sh mvnw -B test
