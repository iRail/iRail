spring.application.name=irail-java
spring.threads.virtual.enabled=true

# NMBS/SNCB GTFS-RT via FlatTurtle's mirror of the Belgian Mobility feed (binary protobuf, CC BY 4.0).
# The mirror caches upstream (~30s) and keeps the Belgian Mobility partner key server-side.
gtfs.rt.url=https://gtfs.flatturtle.cloud/sncb-nmbs/_realtime/trip-update
gtfs.rt.pollMs=30000
# Access token for the mirror. Left empty here; set via the GTFS_RT_APIKEY environment variable in production.
gtfs.rt.apiKey=
gtfs.rt.apiKeyHeader=x-rt-token
gtfs.static.url=https://gtfs.flatturtle.cloud/sncb-nmbs/_latest/sncb-nmbs-gtfs.zip
gtfs.static.range.back=2
gtfs.static.range.forward=62

nmbs.riv.key=
nmbs.riv.limitRpm=40

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.open-in-view=false
spring.main.lazy-initialization=false

server.compression.enabled=true
server.compression.mime-types=application/json,application/ld+json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# Linked Connections 1.0 graph fragments
linked-connections.page-duration=PT10M
linked-connections.time-zone=Europe/Brussels
linked-connections.license=https://creativecommons.org/licenses/by/4.0/
# The one-page LDES retains every observed connection state change for one hour.
linked-connections.feed-retention=PT1H

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=irail-api
spring.datasource.password=irail-api
spring.datasource.url=jdbc:postgresql://localhost:54320/irail-api-java
spring.sql.init.continue-on-error=true

server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.directory=/dev/
server.tomcat.accesslog.file-date-format=
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.pattern=%h %{X-Forwarded-For}i %t "%r" %s %{ms}T %F %{User-Agent}i

logging.level.org.apache.tomcat=INFO
logging.level.org.apache.catalina=INFO
